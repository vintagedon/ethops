<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EthOps">
  <!-- Flat app-icon: accent tile, no text. Accent = slate indigo (#4a5aa0). -->
  <rect width="64" height="64" rx="14" fill="#4a5aa0"/>
  <!-- The work: planned upper course (translucent) over the delivered base (solid) -->
  <rect x="22" y="13" width="20" height="38" rx="3" fill="#ffffff" fill-opacity="0.45"/>
  <rect x="22" y="31" width="20" height="20" rx="3" fill="#ffffff"/>
  <!-- Scaffolding: two standards and two ledgers around the work -->
  <rect x="14" y="13" width="4" height="39" rx="1.5" fill="#ffffff"/>
  <rect x="46" y="13" width="4" height="39" rx="1.5" fill="#ffffff"/>
  <rect x="11" y="20" width="42" height="4" rx="1.5" fill="#ffffff"/>
  <rect x="11" y="34" width="42" height="4" rx="1.5" fill="#ffffff"/>
</svg>
